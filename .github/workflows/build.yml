name: Build AA Wireless Toggle APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Compile APK Directly
        run: |
          set -e
          mkdir -p app/src/main/java/com/custom/aatoggle
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AAToggle"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.custom.aatoggle'
              compileSdk 34
              defaultConfig {
                  applicationId "com.custom.aatoggle"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="AA Wireless"
                  android:icon="@android:drawable/stat_sys_data_bluetooth"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <activity
                      android:name=".TriggerActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:noHistory="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ToggleAccessibilityService"
                      android:exported="true"
                      android:label="AA Wireless Auto-Toggle"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/java/com/custom/aatoggle/TriggerActivity.java
          package com.custom.aatoggle;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.widget.Toast;

          public class TriggerActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (!isAccessibilityEnabled()) {
                      Toast.makeText(this, "Abilita 'AA Wireless Auto-Toggle' in Accessibilità", Toast.LENGTH_LONG).show();
                      Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                      finish();
                      return;
                  }

                  ToggleAccessibilityService.shouldToggle = true;
                  ToggleAccessibilityService.scrollAttempts = 0;

                  try {
                      Intent intent = new Intent();
                      intent.setComponent(new ComponentName(
                          "com.google.android.projection.gearhead",
                          "com.google.android.projection.gearhead.companion.settings.DefaultSettingsActivity"
                      ));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      startActivity(intent);
                  } catch (Exception e) {
                      try {
                          Intent fallback = new Intent("com.google.android.gms.car.PROJECTION_SETTINGS");
                          fallback.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(fallback);
                      } catch (Exception ex) {
                          Toast.makeText(this, "Impossibile aprire Android Auto", Toast.LENGTH_SHORT).show();
                          ToggleAccessibilityService.shouldToggle = false;
                      }
                  }
                  finish();
              }

              private boolean isAccessibilityEnabled() {
                  String service = getPackageName() + "/" + ToggleAccessibilityService.class.getCanonicalName();
                  String enabledServices = Settings.Secure.getString(
                      getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (enabledServices != null) {
                      TextUtils.SimpleStringSplitter splitter = new TextUtils.SimpleStringSplitter(':');
                      splitter.setString(enabledServices);
                      while (splitter.hasNext()) {
                          if (splitter.next().equalsIgnoreCase(service)) {
                              return true;
                          }
                      }
                  }
                  return false;
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/custom/aatoggle/ToggleAccessibilityService.java
          package com.custom.aatoggle;

          import android.accessibilityservice.AccessibilityService;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;
          import java.util.List;

          public class ToggleAccessibilityService extends AccessibilityService {
              public static boolean shouldToggle = false;
              public static int scrollAttempts = 0;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (!shouldToggle) return;

                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;

                  List<AccessibilityNodeInfo> nodes = root.findAccessibilityNodeInfosByText("Modalità wireless di Android Auto");
                  if (nodes == null || nodes.isEmpty()) {
                      nodes = root.findAccessibilityNodeInfosByText("Android Auto wireless");
                  }

                  if (nodes != null && !nodes.isEmpty()) {
                      for (AccessibilityNodeInfo node : nodes) {
                          if (clickNodeOrParent(node)) {
                              shouldToggle = false;
                              Toast.makeText(this, "Modalità Wireless commutata!", Toast.LENGTH_SHORT).show();
                              handler.postDelayed(() -> performGlobalAction(GLOBAL_ACTION_HOME), 350);
                              return;
                          }
                      }
                  }

                  if (scrollAttempts < 5) {
                      AccessibilityNodeInfo scrollable = findScrollableNode(root);
                      if (scrollable != null) {
                          scrollAttempts++;
                          scrollable.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD);
                      }
                  }
              }

              private boolean clickNodeOrParent(AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current = node;
                  while (current != null) {
                      if (current.isClickable() || current.isCheckable()) {
                          return current.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      }
                      current = current.getParent();
                  }
                  return false;
              }

              private AccessibilityNodeInfo findScrollableNode(AccessibilityNodeInfo root) {
                  if (root == null) return null;
                  if (root.isScrollable()) return root;
                  for (int i = 0; i < root.getChildCount(); i++) {
                      AccessibilityNodeInfo res = findScrollableNode(root.getChild(i));
                      if (res != null) return res;
